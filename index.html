<body>

  <header class="site-header" data-header></header>

  <main>
    <section class="hero">
      <div class="hero__stage">
        <div class="hero__slide sky is-on" aria-hidden="true">
          <img class="feather" src="assets/img/products/b06.jpg" alt="" width="900" height="900" fetchpriority="high">
        </div>
        <div class="hero__slide hero__slide--photo" aria-hidden="true">
          <img src="assets/img/hero-margaritto.jpg" alt="" loading="lazy">
        </div>
        <div class="hero__slide hero__slide--photo" aria-hidden="true">
          <img src="assets/img/hero-smaylo.jpg" alt="" loading="lazy">
        </div>
        <div class="hero__text">
          <div class="hero__copy is-on">
            <p class="eyebrow">Qogʻoz mahsulotlari</p>
            <h1 class="h100">Bulut</h1>
            <a class="btn btn--glass" href="bulut.html">Batafsil</a>
          </div>
          <div class="hero__copy">
            <p class="eyebrow">Margarin</p>
            <p class="h100">Margaritto</p>
            <a class="btn btn--glass" href="margaritto.html">Batafsil</a>
          </div>
          <div class="hero__copy">
            <p class="eyebrow">Spred</p>
            <p class="h100">Smaylo</p>
            <a class="btn btn--glass" href="smaylo.html">Batafsil</a>
          </div>
        </div>
        <div class="hero__dots">
          <button class="hero__dot" type="button" aria-pressed="true" aria-label="Bulut"></button>
          <button class="hero__dot" type="button" aria-pressed="false" aria-label="Margaritto"></button>
          <button class="hero__dot" type="button" aria-pressed="false" aria-label="Smaylo"></button>
        </div>
        <div class="hero__shade"></div>
      </div>

      <div class="roller">
        <ul class="roller__list">
          <li>
            <a class="mcard sky" href="bulut.html">
              <img class="mcard__img mcard__img--top feather" src="assets/img/products/t05.jpg" alt="" loading="lazy" width="900" height="900">
              <div class="mcard__text"><p class="eyebrow">Qogʻoz mahsulotlari</p><h2 class="mcard__title">Bulut</h2></div>
            </a>
          </li>
          <li>
            <a class="mcard" href="margaritto.html">

              <div class="mcard__text"><p class="eyebrow">Margarin</p><h2 class="mcard__title">Margaritto</h2></div>
            </a>
          </li>
          <li>
            <a class="mcard" href="smaylo.html">
              <img class="mcard__img mcard__img--pos" src="assets/img/card-smaylo.jpg" alt="" loading="lazy">
              <div class="mcard__text"><p class="eyebrow">Spred</p><h2 class="mcard__title">Smaylo</h2></div>
            </a>
          </li>
          <li>
            <a class="mcard sky sky--leaf" href="pandoozy.html">
              <img class="mcard__img mcard__img--top feather" src="assets/img/products/p03.jpg" alt="" loading="lazy" width="900" height="900">
              <div class="mcard__text"><p class="eyebrow">Olti qatlamgacha</p><h2 class="mcard__title">PanDoozy</h2></div>
            </a>
          </li>
        </ul>
      </div>

    <section class="push sky">
      <div class="push__text">
        <p class="eyebrow">Aberno mahsulotlari</p>
        <h2 class="h100">Mahsulotlar kolleksiyasi</h2>
        <a class="btn btn--ink" href="catalog.html">Davom etish</a>
      </div>
      <div class="push__row" aria-hidden="true">
        <img class="feather" src="assets/img/products/s03.jpg" alt="" loading="lazy" width="900" height="900">
        <img class="feather" src="assets/img/products/u02.jpg" alt="" loading="lazy" width="900" height="900">
        <img class="feather" src="assets/img/products/b02.jpg" alt="" loading="lazy" width="900" height="900">
        <img class="feather" src="assets/img/products/t06.jpg" alt="" loading="lazy" width="900" height="900">
        <img class="feather" src="assets/img/products/h05.jpg" alt="" loading="lazy" width="900" height="900">
